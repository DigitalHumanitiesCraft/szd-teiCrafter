<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>teiCrafter SZD</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Icon sprite: stroke icons drawn in currentColor, referenced with <use>. -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1H7.5a2 2 0 0 0-1.9 1.4L3.5 18"/><path d="M3.5 18 6 11h16l-2.4 7a2 2 0 0 1-1.9 1H5a2 2 0 0 1-1.5-1z"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></symbol>
    <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-error" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></symbol>
    <symbol id="i-validate" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12h3M3.5 18h3"/></symbol>
    <symbol id="i-source" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-rot-left" viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M4.5 10A8 8 0 1 1 6 16.5"/></symbol>
    <symbol id="i-rot-right" viewBox="0 0 24 24"><path d="M20 4v6h-6"/><path d="M19.5 10A8 8 0 1 0 18 16.5"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6M11 8v6"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
    <symbol id="i-zoom-in" viewBox="0 0 24 24"><path d="M5 19 10 6h1l5 13M7 15h7"/><path d="M18 4v6M15 7h6"/></symbol>
    <symbol id="i-zoom-out" viewBox="0 0 24 24"><path d="M5 19 10 6h1l5 13M7 15h7"/><path d="M15 7h6"/></symbol>
    <symbol id="i-wrap" viewBox="0 0 24 24"><path d="M4 6h16M4 12h13a3 3 0 0 1 0 6h-4"/><path d="m15 16-2 2 2 2"/><path d="M4 18h5"/></symbol>
    <symbol id="i-hide" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/><path d="m8 10 2 2-2 2"/></symbol>
    <symbol id="i-diff" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M9 9.5h6M12 6.5v6M9 16.5h6"/></symbol>
    <symbol id="i-docs" viewBox="0 0 24 24"><path d="M8 3h9l3 3v12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M4 7v13a1 1 0 0 0 1 1h11"/><path d="M10 9h7M10 13h7"/></symbol>
    <symbol id="i-show" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/><path d="m10 10-2 2 2 2"/></symbol>
  </svg>

  <header class="app-header">
    <div class="doc-id">
      <h1 id="doc-title">teiCrafter SZD</h1>
      <p id="doc-meta" class="doc-meta"></p>
    </div>
    <div class="doc-work">
      <p id="doc-state" class="doc-state" role="status"><span id="doc-state-label"></span><span id="doc-state-detail" class="doc-state-detail"></span></p>
      <button id="accept" type="button" class="primary" hidden>Abnehmen</button>
      <p id="save-state" class="visually-hidden" role="status"></p>
    </div>
    <div class="toolbar header-tools">
      <button id="docs-button" type="button" aria-haspopup="dialog">
        <svg class="icon"><use href="#i-docs"/></svg>Dokumente
      </button>
      <button id="tei-open" class="icon-button" type="button" aria-label="TEI-Datei öffnen" data-tip="TEI-Datei öffnen">
        <svg class="icon"><use href="#i-open"/></svg>
      </button>
      <input id="tei-file" type="file" accept=".xml,application/xml,text/xml" hidden>
      <button id="tei-save" class="icon-button" type="button" aria-label="TEI speichern" data-tip="TEI speichern (Strg+S)">
        <svg class="icon"><use href="#i-save"/></svg>
      </button>
    </div>
  </header>

  <main id="workspace" class="workspace">
    <section class="pane pane-text" aria-labelledby="text-heading">
      <h2 id="text-heading" class="visually-hidden">TEI-Quelltext</h2>
      <div class="toolbar">
        <button id="wf-button" class="check" type="button" aria-describedby="xml-status">
          <svg class="icon"><use href="#i-ok"/></svg><span id="wf-label" class="label">Wohlgeformt</span>
        </button>
        <button id="valid-button" class="check" type="button" aria-describedby="xml-status">
          <svg class="icon"><use href="#i-validate"/></svg><span id="valid-label" class="label">Validieren</span>
        </button>
        <button id="work-button" class="check" type="button" data-tip="Nächste offene Stelle (F8)">
          <svg class="icon"><use href="#i-task"/></svg><span id="work-label" class="label">offene Stellen</span>
        </button>
        <span class="toolbar-gap"></span>
        <button id="diff-button" class="icon-button" type="button" aria-haspopup="dialog" aria-label="Änderungen seit dem Öffnen" data-tip="Änderungen seit dem Öffnen">
          <svg class="icon"><use href="#i-diff"/></svg>
        </button>
        <button id="zoom-out" class="icon-button" type="button" aria-label="Code verkleinern" data-tip="Code verkleinern (Strg + Mausrad)">
          <svg class="icon"><use href="#i-zoom-out"/></svg>
        </button>
        <button id="zoom-reset" class="zoom-label" type="button" aria-label="Codegröße zurücksetzen" data-tip="Codegröße zurücksetzen">100 %</button>
        <button id="zoom-in" class="icon-button" type="button" aria-label="Code vergrößern" data-tip="Code vergrößern (Strg + Mausrad)">
          <svg class="icon"><use href="#i-zoom-in"/></svg>
        </button>
        <button id="wrap-toggle" class="icon-button" type="button" aria-pressed="true" aria-label="Zeilenumbruch" data-tip="Zeilenumbruch">
          <svg class="icon"><use href="#i-wrap"/></svg>
        </button>
      </div>
      <div id="editor" class="code"></div>
      <p class="hint">Text markieren, dann annotieren im Menü an der Markierung oder mit Strg+.</p>
      <div id="xml-status" class="status" role="status"></div>
    </section>

    <div id="splitter" class="splitter" role="separator" tabindex="0" aria-orientation="vertical"
      aria-controls="image-pane" aria-label="Breite des Faksimiles"
      aria-valuemin="20" aria-valuemax="100" aria-valuenow="50"></div>

    <section id="image-pane" class="pane pane-image" aria-labelledby="image-heading">
      <h2 id="image-heading" class="visually-hidden">Faksimile</h2>
      <div class="toolbar">
        <button id="page-prev" class="icon-button" type="button" aria-label="Vorherige Seite" data-tip="Vorherige Seite">
          <svg class="icon"><use href="#i-prev"/></svg>
        </button>
        <span id="page-label" class="page-label" aria-live="polite"></span>
        <button id="page-next" class="icon-button" type="button" aria-label="Nächste Seite" data-tip="Nächste Seite">
          <svg class="icon"><use href="#i-next"/></svg>
        </button>
        <span class="toolbar-sep"></span>
        <button id="img-out" class="icon-button" type="button" aria-label="Bild verkleinern" data-tip="Verkleinern">
          <svg class="icon"><use href="#i-minus"/></svg>
        </button>
        <button id="img-fit" class="icon-button" type="button" aria-label="Bild einpassen" data-tip="Einpassen">
          <svg class="icon"><use href="#i-fit"/></svg>
        </button>
        <button id="img-in" class="icon-button" type="button" aria-label="Bild vergrößern" data-tip="Vergrößern">
          <svg class="icon"><use href="#i-plus"/></svg>
        </button>
        <span class="toolbar-sep"></span>
        <button id="rot-left" class="icon-button" type="button" aria-label="Bild nach links drehen" data-tip="Nach links drehen">
          <svg class="icon"><use href="#i-rot-left"/></svg>
        </button>
        <button id="rot-right" class="icon-button" type="button" aria-label="Bild nach rechts drehen" data-tip="Nach rechts drehen">
          <svg class="icon"><use href="#i-rot-right"/></svg>
        </button>
        <span class="toolbar-gap"></span>
        <button id="source-toggle" class="icon-button" type="button" aria-expanded="false" aria-controls="iiif-form"
          aria-label="Bildquelle" data-tip="Bildquelle (IIIF)">
          <svg class="icon"><use href="#i-source"/></svg>
        </button>
        <button id="facs-hide" class="icon-button" type="button" aria-label="Faksimile ausblenden" data-tip="Faksimile ausblenden">
          <svg class="icon"><use href="#i-hide"/></svg>
        </button>
      </div>
      <form id="iiif-form" class="toolbar source-form" hidden>
        <label class="iiif-field">
          <span class="visually-hidden">IIIF-Manifest, info.json oder Bild-URL</span>
          <input id="iiif-url" type="url" required placeholder="IIIF-Manifest, info.json oder Bild-URL">
        </label>
        <button type="submit">Laden</button>
      </form>
      <div id="viewer" class="viewer" role="img" aria-label="Faksimile"></div>
      <p id="iiif-status" class="status" role="status"></p>
    </section>

    <button id="facs-show" class="icon-button facs-show" type="button" aria-label="Faksimile einblenden"
      data-tip="Faksimile einblenden" hidden>
      <svg class="icon"><use href="#i-show"/></svg>
    </button>
  </main>

  <div id="actions" class="actions" role="menu" aria-label="Annotieren" hidden>
    <div id="actions-quote" class="actions-quote" aria-live="polite"></div>
    <button type="button" role="menuitem" data-action="person"><svg class="icon"><use href="#i-person"/></svg>Person</button>
    <button type="button" role="menuitem" data-action="del">Streichung</button>
    <button type="button" role="menuitem" data-action="unclear">Unsicher</button>
    <button type="button" role="menuitem" data-action="add">Ergänzung</button>
  </div>

  <dialog id="person-dialog" class="person-dialog" aria-labelledby="person-title">
    <form id="person-form" method="dialog">
      <h2 id="person-title">Person annotieren: <span id="person-text"></span></h2>
      <div class="toolbar">
        <label class="grow">
          <span class="visually-hidden">Name suchen</span>
          <input id="person-query" type="search" autocomplete="off" placeholder="Name suchen">
        </label>
        <button id="person-search" type="button">Auch in der GND suchen</button>
      </div>
      <p id="person-status" class="status" role="status"></p>
      <h3 id="register-heading" class="results-heading"></h3>
      <ul id="register-results" class="results" aria-labelledby="register-heading"></ul>
      <h3 id="gnd-heading" class="results-heading" hidden>GND</h3>
      <ul id="person-results" class="results" aria-labelledby="gnd-heading"></ul>
      <label class="manual">
        Kennung (Personenindex oder GND)
        <input id="person-gnd" type="text" autocomplete="off" placeholder="z. B. SZDPER.2188 oder 116402873">
      </label>
      <p id="person-preview" class="preview"></p>
      <div class="toolbar dialog-actions">
        <button type="button" id="person-cancel">Abbrechen</button>
        <button type="submit" id="person-apply" class="primary" value="apply">Annotieren</button>
      </div>
    </form>
  </dialog>

  <dialog id="docs-dialog" class="docs-dialog" aria-labelledby="docs-title">
    <form method="dialog">
      <h2 id="docs-title">Dokumente</h2>
      <div class="toolbar">
        <label class="grow">
          <span class="visually-hidden">Dokumente durchsuchen</span>
          <input id="docs-query" type="search" autocomplete="off" placeholder="Titel, Signatur oder Objekt-ID">
        </label>
        <label>
          <span class="visually-hidden">Arbeitsstand</span>
          <select id="docs-state">
            <option value="">Alle Stände</option>
            <option value="open">Mit offenen Stellen</option>
            <option value="draft">In Bearbeitung</option>
            <option value="approved">Abgenommen</option>
          </select>
        </label>
      </div>
      <div id="docs-collections" class="chips" role="group" aria-label="Sammlung"></div>
      <p id="docs-count" class="docs-count" role="status"></p>
      <div id="docs-list" class="docs-list"></div>
      <div class="toolbar dialog-actions">
        <button type="submit">Schließen</button>
      </div>
    </form>
  </dialog>

  <dialog id="diff-dialog" class="diff-dialog" aria-labelledby="diff-title">
    <form method="dialog">
      <h2 id="diff-title">Änderungen seit dem Öffnen</h2>
      <p id="diff-summary" class="diff-summary"></p>
      <div id="diff-body" class="diff-body"></div>
      <div class="toolbar dialog-actions">
        <button type="submit" class="primary">Schließen</button>
      </div>
    </form>
  </dialog>

  <dialog id="ask-dialog" class="ask-dialog" aria-labelledby="ask-title" aria-describedby="ask-text">
    <form method="dialog">
      <h2 id="ask-title"></h2>
      <p id="ask-text"></p>
      <div id="ask-actions" class="toolbar dialog-actions"></div>
    </form>
  </dialog>

  <!-- OpenSeadragon ships as UMD, so it loads as a classic script that sets
       window.OpenSeadragon for the modules below. -->
  <script src="vendor/openseadragon/openseadragon.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
